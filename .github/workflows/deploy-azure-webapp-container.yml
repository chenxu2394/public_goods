name: Build and Deploy Container to Azure Web App

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: public-goods-experiment

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "scripts/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lower-case owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Validate required config
        shell: bash
        env:
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBAPP_NAME:-}" ]]; then
            echo "Missing repository variable: AZURE_WEBAPP_NAME"
            exit 1
          fi
          if [[ -z "${AZURE_PUBLISH_PROFILE:-}" ]]; then
            echo "Missing repository secret: AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi

      - name: Set lower-case owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
