[project]
name = "public-goods"
version = "0.1.0"
description = "Public goods classroom experiment service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "jinja2==3.1.4",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.9",
  "segno>=1.6.6",
  "uvicorn==0.30.6",
]

[dependency-groups]
dev = [
  "djlint>=1.39.2",
  "httpx==0.27.2",
  "pytest==8.3.5",
]

[tool.djlint]
profile = "jinja"
ignore = "H006,H021,H023,H030,H031,J018,T003,T028"
