<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Public Goods Experiment</title>
  <style>
    :root{
      color-scheme: light;
    }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #f5f7fb 0%, #eef3f7 100%);
      color:#16202a;
    }
    .panel{
      width:min(720px, 100%);
      padding:48px 32px;
      border:1px solid #d8e1ea;
      border-radius:20px;
      background:#ffffff;
      box-shadow:0 18px 48px rgba(22, 32, 42, 0.08);
      text-align:center;
    }
    h1{
      margin:0;
      font-size:clamp(2rem, 5vw, 3.25rem);
      line-height:1.1;
    }
    p{
      margin:16px 0 0 0;
      font-size:0.95rem;
      color:#4b5a68;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Welcome to the Public Goods Experiment</h1>
    <p>Please wait for and follow the teacher's instruction</p>
  </main>
</body>
</html>
