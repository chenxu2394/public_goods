<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title if title else ((heading ~ " · Public Goods Experiment") if heading else "Public Goods Experiment") }}</title>
  {% include "_styles.html" %}
</head>
<body data-scroll-page="{{ scroll_page if scroll_page else request.url.path }}">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="page-shell">
    <header class="app-header">
      <div class="app-heading">
        <div class="app-kicker">Public Goods Experiment</div>
        <h1 class="app-title">{{ heading if heading else "" }}</h1>
        {% if subheading %}<p class="app-subtitle">{{ subheading }}</p>{% endif %}
      </div>
      <nav class="page-actions" aria-label="Page actions">
        {% block top_right %}{% endblock %}
      </nav>
    </header>
    <main class="app-main" id="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% include "_scroll_preservation.html" %}
</body>
</html>
